<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b5c">
<meta name="description" content="Control personal de ingresos, gastos, pagos fijos, presupuestos, metas y deudas.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mis Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: columna de trabajo de 980px; barra de pestañas fija arriba, cifras clave primero, detalle debajo */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e8eeec; --line:#d3dedb;
  --fg:#11211d; --muted:#5a6d68;
  --accent:#0d6b5c; --accent-ink:#ffffff; --accent-soft:#d6ebe6;
  --good:#1f7a3f; --warn:#a35f00; --bad:#b42318;
  --good-soft:#dcf0e2; --warn-soft:#fbecd2; --bad-soft:#fbe0dc;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1513; --surface:#14201d; --sunk:#1a2925; --line:#29403a;
  --fg:#e4efec; --muted:#93a9a3;
  --accent:#4fc2ac; --accent-ink:#06201b; --accent-soft:#173a33;
  --good:#5cc983; --warn:#e8a64a; --bad:#f07a6e;
  --good-soft:#163524; --warn-soft:#3a2a12; --bad-soft:#3d1a17;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1513; --surface:#14201d; --sunk:#1a2925; --line:#29403a;
  --fg:#e4efec; --muted:#93a9a3;
  --accent:#4fc2ac; --accent-ink:#06201b; --accent-soft:#173a33;
  --good:#5cc983; --warn:#e8a64a; --bad:#f07a6e;
  --good-soft:#163524; --warn-soft:#3a2a12; --bad-soft:#3d1a17;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:1.5rem;margin:0;letter-spacing:-.01em}
.month{display:flex;align-items:center;gap:6px}
.month strong{font-family:var(--f-display);font-size:1.05rem;min-width:9.5em;text-align:center}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:500 .92rem var(--f-body);padding:10px 12px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main{padding-block:20px 48px;display:grid;gap:20px}
h2{font-family:var(--f-display);font-size:1.15rem;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:.88rem;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:2px}
.kpi .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .val{font-family:var(--f-num);font-size:1.45rem;font-variant-numeric:tabular-nums}
.kpi .note{font-size:.82rem;color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero .lbl,.kpi.hero .note{color:var(--accent-ink);opacity:.85}
.kpi.neg{background:var(--bad-soft);border-color:var(--bad)}
.kpi.neg .val{color:var(--bad)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
form.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label.f{display:grid;gap:3px;font-size:.78rem;color:var(--muted);flex:1 1 130px;min-width:0}
label.f.wide{flex:2 1 200px}
input,select{font:inherit;font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:600 .9rem var(--f-body);border-radius:7px;padding:9px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.icon{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 9px;cursor:pointer;font:500 .8rem var(--f-body)}
.icon:hover{color:var(--fg);border-color:var(--muted)}
.icon.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--muted);font:500 .88rem var(--f-body);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
ul.list{list-style:none;margin:0;padding:0;display:grid}
ul.list li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
ul.list li:first-child{border-top:0}
.li-main{min-width:0}
.li-main b{font-weight:600;display:block;overflow-wrap:anywhere}
.li-main small{color:var(--muted)}
.chip{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.in{color:var(--good)} .out{color:var(--fg)}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)} .bar.good>i{background:var(--good)}
.budget{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.budget:first-child{border-top:0}
.budget .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.budget input{width:9.5em;padding:5px 8px;font-size:.88rem}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.empty{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);font-size:.9rem}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chart{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:200px;padding-top:8px;border-bottom:1px solid var(--line)}
.col{display:flex;gap:3px;align-items:end;height:100%;justify-content:center}
.col i{display:block;width:min(22px,40%);border-radius:4px 4px 0 0;min-height:2px}
.col .ci{background:var(--accent)} .col .co{background:var(--warn)}
.xl{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;text-align:center;font-size:.78rem;color:var(--muted);text-transform:capitalize}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--accent)}
.legend span.o::before{background:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:right;padding:8px 6px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;text-transform:capitalize}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;border-top:0}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:12px 14px;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
.status{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s ease}}

/* base que antes daba claude.ai */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* cuenta */
.user{display:flex;align-items:center;gap:8px;min-width:0}
.user .status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14em}
.auth{min-height:80vh;display:grid;place-items:center;padding-block:32px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:16px}
.auth-card h1{font-size:1.8rem}
.auth-card form{display:grid;gap:12px}
.auth-card .btn{width:100%;padding:11px}
.linkbtn{background:none;border:0;color:var(--accent);font:500 .88rem var(--f-body);cursor:pointer;padding:0;text-align:left}
.msg{font-size:.88rem;border-radius:8px;padding:10px 12px}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--good-soft);color:var(--good)}
</style>
</head>
<body>

<header class="top" id="topbar" hidden>
  <div class="wrap">
    <div class="brand">
      <h1>Mis Finanzas</h1>
      <div class="month">
        <button class="icon" data-act="prevMonth" aria-label="Mes anterior">&lsaquo;</button>
        <strong id="monthLabel">mes</strong>
        <button class="icon" data-act="nextMonth" aria-label="Mes siguiente">&rsaquo;</button>
      </div>
      <div class="user"><span id="userEmail" class="status"></span><button class="icon" data-act="logout">Cerrar sesión</button></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<div class="wrap" id="appView" hidden><main id="app"><div class="empty">Cargando tus datos...</div></main></div>
<div class="wrap" id="authView"><main class="auth">
  <div class="auth-card">
    <div><h1>Mis Finanzas</h1><p class="sub" id="authSub">Inicia sesión para ver tus ingresos y gastos.</p></div>
    <div class="msg" id="authMsg" hidden></div>
    <form id="authForm" novalidate>
      <label class="f" id="emailRow">Correo<input id="authEmail" type="email" autocomplete="email" required></label>
      <label class="f" id="passRow">Contraseña<input id="authPass" type="password" autocomplete="current-password" minlength="6" required></label>
      <button class="btn" id="authBtn">Iniciar sesión</button>
    </form>
    <button class="linkbtn" id="authSwitch" type="button">No tengo cuenta, quiero registrarme</button>
    <button class="linkbtn" id="authForgot" type="button">Olvidé mi contraseña</button>
  </div>
</main></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
